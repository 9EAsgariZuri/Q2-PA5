<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container bg-primary p-5 mt-5 rounded">
    <form action="" method="post">

        <h2>Custom Sneaker Order Form</h2>

        <label for="form-name" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="textinput form-control">
    
        <label for="form-email" class="form-label">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="textinput form-control">

        <label for="form-tel" class="form-label">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

        <label for="form-story" class="form-label">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="form-control"></textarea>
        
        <label for="sizes" class="form-label">Size:</label>
        <select name="size" id="sizes" class="form-control form-select">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
<br>
<br>

    <div class="form-check">
        <label for="colors" class="form-label form-check-label">Sneaker Color:</label>
        <fieldset id="colors" class="form-control">
            <legend>Color</legend>
            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="red"> Red</label>
            </div>

            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="blue"> Blue</label>
            </div> 

            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="black"> Black</label>
            </div>
             
            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="silver"> Silver</label>
            </div>
        </fieldset>
    </div>
            
<br>

    <div class="form-check">
        <label for="features" class="form-label form-check-label">Add-on Features:</label>
        <fieldset id="features" class="form-control">
            <legend>Feature</legend>

            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="laces"> Sparkley laces</label>
            </div>

            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
            </div>

            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="heels"> Light-up heels</label>
            </div>

            <div class="form-check">
                <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
            </div>
        </fieldset>
    </div>

<br>

        <button type="button" class="btn btn-light" value="ENTER">ENTER</button>
    </form>
</div>

</body>
</html>
